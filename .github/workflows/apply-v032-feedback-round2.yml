name: Apply ZoolChat v0.32 feedback round 2

on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - 'scripts/apply_v032_feedback_round2.py'
      - 'scripts/fix_v032_feedback_round2_patch.py'
      - '.github/workflows/apply-v032-feedback-round2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoolchat-v032-feedback-round2
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zoolchat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/zoolchat_test
      FIREBASE_AUTH_ENABLED: 'false'
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: '1025'
      MAIL_FROM: ZoolChat Validation <noreply@example.invalid>
      MAIL_REQUIRE_TLS: 'false'
      EMAIL_RATE_LIMIT_PER_15_MINUTES: '100'
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-test-key
      LIVEKIT_API_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0

      - name: Apply feedback patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_v032_feedback_round2.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          fixed=0
          out=[]
          for line in lines:
              if line == '    """,':
                  out.append('    "",')
                  fixed += 1
              else:
                  out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'Normalized {fixed} empty replacement literals')
          PY
          python3 -m py_compile scripts/apply_v032_feedback_round2.py scripts/fix_v032_feedback_round2_patch.py
          python3 scripts/apply_v032_feedback_round2.py
          python3 scripts/fix_v032_feedback_round2_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/tests/message-interactions.mjs')
          text=p.read_text(encoding='utf-8')
          old="""          assert.equal((await put('/api/e2ee/backup',backup,a.token)).status,200,'encrypted identity backup must upload');
          assert.equal((await get('/api/e2ee/self-key',a.token)).status,200,'self identity metadata must exist after backup upload');
          const restored=await get('/api/e2ee/backup',a.token);assert.equal(restored.status,200);const rb=(await restored.json()).backup;assert.equal(rb.publicKeyB64,backup.publicKeyB64);assert.equal(rb.ciphertextB64,backup.ciphertextB64);
"""
          new="""          const backupPut=await put('/api/e2ee/backup',backup,a.token);assert.equal(backupPut.status,200,'encrypted identity backup must upload');
          const dbState=await pool.query(`SELECT (SELECT count(*)::int FROM user_crypto_keys WHERE user_id=$1) key_count,(SELECT count(*)::int FROM e2ee_identity_backups WHERE user_id=$1) backup_count`,[a.id]);console.log('E2EE_DB_STATE',dbState.rows[0]);
          const selfKey=await get('/api/e2ee/self-key',a.token);console.log('E2EE_SELF_KEY_STATUS',selfKey.status,await selfKey.clone().text());assert.equal(selfKey.status,200,'self identity metadata must exist after backup upload');
          const restored=await get('/api/e2ee/backup',a.token);console.log('E2EE_BACKUP_STATUS',restored.status,await restored.clone().text());assert.equal(restored.status,200);const rb=(await restored.json()).backup;assert.equal(rb.publicKeyB64,backup.publicKeyB64);assert.equal(rb.ciphertextB64,backup.ciphertextB64);
"""
          if text.count(old)!=1:
              raise SystemExit(f'diagnostic test anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Privacy and backend build
        run: |
          set -euo pipefail
          python3 scripts/privacy_scan.py
          cd server
          npm ci --no-audit --no-fund
          npm run build

      - name: Backend migrations and integration tests
        working-directory: server
        run: |
          set -euo pipefail
          node dist/migrate.js
          node dist/index.js > /tmp/zoolchat-feedback-validation.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/zoolchat-feedback-validation.log || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health >/dev/null
          node tests/read-state.mjs
          node tests/auth-flow.mjs
          node tests/call-lifecycle.mjs
          node tests/smtp-delivery.mjs
          node tests/email-recovery.mjs
          node tests/profile-meeting.mjs
          node tests/message-interactions.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Android compile and lint
        working-directory: android
        run: gradle :app:assemblePublicDebug :app:lintPublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          rm -f scripts/apply_v032_feedback_round2.py scripts/fix_v032_feedback_round2_patch.py .github/workflows/apply-v032-feedback-round2.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated source changes to commit" >&2
            exit 1
          fi
          git config user.name "ZoolChat CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix v0.32 encrypted history and message interactions"
          git push origin HEAD:zoolchat-v0.32-development

      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-feedback-round2-validation
          path: |
            android/app/build/outputs/apk/public/debug/*.apk
            android/app/build/reports/lint-results-publicDebug.*
          if-no-files-found: error

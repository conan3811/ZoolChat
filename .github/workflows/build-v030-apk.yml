name: Build ZoolChat v0.30 Calls Groups Meet APK

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - 'release/v0_30/current_part_*.b64'
      - '.github/workflows/build-v030-apk.yml'
      - 'cloud/API_BASE_URL.txt'

permissions:
  contents: read

jobs:
  build-public-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend URL
        id: api
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(tr -d '\r\n' < cloud/API_BASE_URL.txt)"
          case "$API_URL" in https://*) ;; *) echo "API_BASE_URL must be HTTPS" >&2; exit 1;; esac
          [[ "$API_URL" != *"YOUR_BACKEND_HOST"* ]] || { echo "Backend URL not configured" >&2; exit 1; }
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Reassemble Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            release/parts/part00.b64 release/parts/part01.b64 release/parts/part02.b64 release/parts/part03.b64 \
            release/parts/part04.b64 release/parts/part05.b64 release/parts/part06.b64 release/parts/part07.b64 \
            release/safe/s08_0.b64 release/safe/s08_1.b64 release/safe/s08_2.b64 release/safe/s08_3.b64 release/safe/s08_4.b64 \
            release/safe/s09_0.b64 release/safe/s09_1.b64 release/safe/s09_2.b64 release/safe/s09_3.b64 release/safe/s09_4.b64 \
            release/parts/part10.b64 release/parts/part11.b64 \
            release/safe/s12_0.b64 release/safe/s12_1.b64 release/safe/s12_2.b64 release/safe/s12_3.b64 \
            release/safe/s12_4a.b64 release/safe/s12_4b.b64 release/safe/s12_4c.b64 \
            release/parts/part13.b64 > work/ZoolChat-source.b64
          base64 -d work/ZoolChat-source.b64 > work/ZoolChat-source.zip
          echo "4c73c58f039a9fbe8b49ccf64825299851fb467039c884701e81fb2022d4dc03  work/ZoolChat-source.zip" | sha256sum -c -
          unzip -q work/ZoolChat-source.zip -d work

      - name: Apply v0.25 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat release/patches/v0_25_0a.b64 release/patches/v0_25_0b.b64 release/patches/v0_25_1.b64 release/patches/v0_25_2.b64 release/patches/v0_25_3.b64 release/patches/v0_25_4.b64 > work/v025.b64
          base64 -d work/v025.b64 > work/v025.tar.gz
          echo "f0d35b65c854027ef04986ad9c6cbe53fd69f5984d71010b567913995be6ab6c  work/v025.tar.gz" | sha256sum -c -
          tar -xzf work/v025.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.26 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat release/v0_26/v026_00.b64 release/v0_26/v026_01.b64 release/v0_26/v026_02.b64 release/v0_26/v026_03.b64 release/v0_26/v026_04.b64 > work/v026.b64
          base64 -d work/v026.b64 > work/v026.tar.gz
          echo "1821b909a6236831aa1569572713854891544753c0d723bd37cae71fac9e7fd0  work/v026.tar.gz" | sha256sum -c -
          tar -xzf work/v026.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.27 security fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release/v0_27/keystore_iv_fix.b64 > work/v027.tar.gz
          echo "efe9e69a3280c3c4478fcbbfe43552a82a3dfd165ff7971a44c3ee313aab1c4d  work/v027.tar.gz" | sha256sum -c -
          tar -xzf work/v027.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.28 country and secure-session overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release/v0_28/v0_28_overlay.b64 > work/v028.tar.gz
          echo "56278c41173c8c02e6005ae5c573691e7c7e3ca7004f4e983e7dd67952a4f52f  work/v028.tar.gz" | sha256sum -c -
          tar -xzf work/v028.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.28.1 profile account fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release/v0_28/v0_28_1_profile_account_fix.b64 > work/v0281.tar.gz
          echo "b782e9cafa1a4703366c36e03f7a157227284bf9d3eb9d2a914cc2396a073b4b  work/v0281.tar.gz" | sha256sum -c -
          tar -xzf work/v0281.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.30 calls groups meet overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            release/v0_30/current_part_00.b64 release/v0_30/current_part_01.b64 \
            release/v0_30/current_part_02a0.b64 release/v0_30/current_part_02a1.b64 \
            release/v0_30/current_part_02a2.b64 release/v0_30/current_part_02a3.b64 \
            release/v0_30/current_part_02b.b64 \
            release/v0_30/current_part_03.b64 release/v0_30/current_part_04.b64 release/v0_30/current_part_05.b64 \
            release/v0_30/current_part_06.b64 > work/v030.b64
          base64 -d work/v030.b64 > work/v030.tar.gz
          echo "13b4886fecfa484ee09051b059c62f0880ca4e1bb24fcc9f6a68081504ee65f8  work/v030.tar.gz" | sha256sum -c -
          tar -xzf work/v030.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.30 Kotlin syntax corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app")
          zool = root / "ZoolChatApp.kt"
          s = zool.read_text()
          old = '        }\n    }\n}\n\n@Composable\nprivate fun ZoolBottomBar'
          new = '        }\n    }\n\n@Composable\nprivate fun ZoolBottomBar'
          if old not in s:
              raise SystemExit("ZoolChatApp syntax-fix anchor not found")
          zool.write_text(s.replace(old, new, 1))

          meet = root / "ui/screens/MeetScreen.kt"
          s = meet.read_text()
          old = 'TextButton(onClick=onDone){Text(t("تم"))}}\n\n@Composable private fun MeetRoom'
          new = 'TextButton(onClick=onDone){Text(t("تم"))}}}\n\n@Composable private fun MeetRoom'
          if old not in s:
              raise SystemExit("MeetScreen syntax-fix anchor not found")
          meet.write_text(s.replace(old, new, 1))
          PY

      - name: Validate v0.30 behavior wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app
          grep -q 'suspend fun acceptCall' "$ROOT/network/ApiClient.kt"
          grep -q 'suspend fun declineCall' "$ROOT/network/ApiClient.kt"
          grep -q 'suspend fun joinMeeting' "$ROOT/network/ApiClient.kt"
          grep -q 'autoAcceptIncoming' "$ROOT/ui/screens/ProductionCallScreen.kt"
          grep -Fq 'if (!incoming || autoAcceptIncoming)' "$ROOT/ui/screens/ProductionCallScreen.kt"
          grep -q 'api.declineCall' "$ROOT/ui/screens/ProductionCallScreen.kt"
          grep -q 'api.joinMeeting' "$ROOT/ui/screens/MeetScreen.kt"
          grep -q 'meetingJoinStatus' "$ROOT/ui/screens/MeetScreen.kt"
          grep -q 'RemoteCallHistoryItem' "$ROOT/ui/screens/ProductionCallsScreen.kt"
          grep -q 'answeredAt' "$ROOT/ui/screens/ProductionChatScreen.kt"
          grep -Fq 'incoming_call_accept",false' "$ROOT/notifications/NotificationHelper.kt"
          ! grep -R -n 'محمد.*@mohamed\|@mohamed.*محمد' "$ROOT/ui/screens" || exit 1

      - name: Prepare Android build
        shell: bash
        run: |
          set -euo pipefail
          ROOT_BUILD=work/ZoolChat_v0_24/android/build.gradle.kts
          APP_BUILD=work/ZoolChat_v0_24/android/app/build.gradle.kts
          SETTINGS_BUILD=work/ZoolChat_v0_24/android/settings.gradle.kts
          sed -i 's/versionCode = 26/versionCode = 31/' "$APP_BUILD"
          sed -i 's/versionName = "0.26.0"/versionName = "0.30.0"/' "$APP_BUILD"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$ROOT_BUILD"
          sed -i 's/id("org.jetbrains.kotlin.kapt") version "2.4.10" apply false/id("com.android.legacy-kapt") version "9.4.0" apply false/' "$ROOT_BUILD"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$APP_BUILD"
          sed -i 's/id("org.jetbrains.kotlin.kapt")/id("com.android.legacy-kapt")/' "$APP_BUILD"
          sed -i 's/id("org.jetbrains.kotlin.plugin.compose") version "2.4.10"/id("org.jetbrains.kotlin.plugin.compose") version "2.3.21"/' "$ROOT_BUILD"
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' "$APP_BUILD"
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("work/ZoolChat_v0_24/android/settings.gradle.kts")
          s = settings.read_text()
          marker = 'dependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n'
          if 'maven("https://jitpack.io")' not in s:
              if marker not in s: raise SystemExit("repositories block not found")
              s = s.replace(marker, marker + '        maven("https://jitpack.io")\n', 1)
              settings.write_text(s)
          screens = Path("work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app/ui/screens")
          for path, imports in {
              screens / "ChatsScreen.kt": ["import androidx.compose.foundation.background"],
              screens / "ProfileScreen.kt": ["import androidx.compose.foundation.background", "import kotlinx.coroutines.launch"],
          }.items():
              text = path.read_text()
              missing = [x for x in imports if x not in text]
              if missing:
                  end = text.find("\n", text.find("package "))
                  path.write_text(text[:end+1] + "\n".join(missing) + "\n" + text[end+1:])

          zool = Path("work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app/ZoolChatApp.kt")
          text = zool.read_text()
          nav_import = "import androidx.navigation.compose.composable"
          if nav_import not in text:
              end = text.find("\n", text.find("package "))
              zool.write_text(text[:end+1] + nav_import + "\n" + text[end+1:])
          PY
          DEBUG_MANIFEST=work/ZoolChat_v0_24/android/app/src/debug/AndroidManifest.xml
          sed -i 's/[[:space:]]android:usesCleartextTraffic="true"//g' "$DEBUG_MANIFEST"

          ROOT=work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app
          echo '=== ZoolChatApp imports/routes ==='
          nl -ba "$ROOT/ZoolChatApp.kt" | sed -n '1,55p;120,235p'
          echo '=== CallEngine ==='
          nl -ba "$ROOT/calling/CallEngine.kt" | sed -n '1,90p'
          echo '=== MessageSyncRepository ==='
          nl -ba "$ROOT/sync/MessageSyncRepository.kt" | sed -n '80,155p'
          echo '=== MeetScreen relevant section ==='
          nl -ba "$ROOT/ui/screens/MeetScreen.kt" | sed -n '230,280p'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 37
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: work/ZoolChat_v0_24/android
        run: gradle :app:assemblePublicDebug -PZOOLCHAT_API_BASE_URL='${{ steps.api.outputs.api_url }}' --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v0.30-calls-groups-meet-apk
          path: work/ZoolChat_v0_24/android/app/build/outputs/apk/public/debug/*.apk
          if-no-files-found: error
          retention-days: 14

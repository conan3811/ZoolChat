name: Cleanup GitHub Actions storage

on:
  workflow_dispatch:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep only essential ZoolChat artifacts and clear caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // These are the only artifact names we currently need for ZoolChat v0.32.
            // For each name, only the newest copy is preserved.
            const protectedNames = new Set([
              'ZoolChat-v0.32-Firebase-publicDebug',
              'ZoolChat-v032-latest-no-firebase',
              'ZoolChat-v032-validation-only-no-firebase',
              'android-apk-signing-tools',
              'zoolchat-v032-android-source',
              'ZoolChat-v032-current-build-source'
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const groups = new Map();
            for (const artifact of artifacts) {
              if (!groups.has(artifact.name)) groups.set(artifact.name, []);
              groups.get(artifact.name).push(artifact);
            }

            const keepIds = new Set();
            for (const name of protectedNames) {
              const items = groups.get(name) || [];
              items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              if (items[0]) keepIds.add(items[0].id);
            }

            const deleteArtifacts = artifacts.filter(a => !keepIds.has(a.id));
            const keptArtifacts = artifacts.filter(a => keepIds.has(a.id));
            const deleteBytes = deleteArtifacts.reduce((n, a) => n + (a.size_in_bytes || 0), 0);
            const keptBytes = keptArtifacts.reduce((n, a) => n + (a.size_in_bytes || 0), 0);

            for (const artifact of keptArtifacts) {
              core.info(`KEEP artifact: ${artifact.name} | id=${artifact.id} | ${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MB | ${artifact.created_at}`);
            }

            core.info(`Artifacts found: ${artifacts.length}`);
            core.info(`Artifacts to delete: ${deleteArtifacts.length}`);
            core.info(`Estimated artifact space to free: ${(deleteBytes / 1024 / 1024).toFixed(1)} MB`);

            for (const artifact of deleteArtifacts) {
              core.info(`DELETE artifact: ${artifact.name} | id=${artifact.id} | ${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MB | ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }

            const caches = [];
            for (let page = 1; ; page++) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner,
                repo,
                per_page: 100,
                page
              });
              const pageCaches = response.data.actions_caches || [];
              caches.push(...pageCaches);
              if (pageCaches.length < 100) break;
            }

            const cacheBytes = caches.reduce((n, c) => n + (c.size_in_bytes || 0), 0);
            core.info(`Caches to delete: ${caches.length}`);
            core.info(`Estimated cache space to free: ${(cacheBytes / 1024 / 1024).toFixed(1)} MB`);

            for (const cache of caches) {
              core.info(`DELETE cache: ${cache.key} | id=${cache.id} | ${(cache.size_in_bytes / 1024 / 1024).toFixed(1)} MB`);
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                owner,
                repo,
                cache_id: cache.id
              });
            }

            core.summary
              .addHeading('GitHub Actions storage cleanup')
              .addTable([
                [{data: 'Item', header: true}, {data: 'Count', header: true}, {data: 'Estimated MB', header: true}],
                ['Artifacts deleted', String(deleteArtifacts.length), (deleteBytes / 1024 / 1024).toFixed(1)],
                ['Essential artifacts retained', String(keptArtifacts.length), (keptBytes / 1024 / 1024).toFixed(1)],
                ['Caches deleted', String(caches.length), (cacheBytes / 1024 / 1024).toFixed(1)]
              ])
              .addRaw('\nOnly the newest essential ZoolChat v0.32 artifacts were preserved. Source code, commits, branches, releases, repository files, and secrets were not changed.')
              .write();

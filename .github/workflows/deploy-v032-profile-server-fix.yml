name: Deploy ZoolChat v0.32 profile server fix
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/deploy-v032-profile-server-fix.yml'
permissions:
  contents: write
jobs:
  patch-live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Prepare repair script
        run: cp scripts/fix_profile_server_runtime_v032.py /tmp/fix_profile_server_runtime_v032.py
      - name: Patch live backend branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout zoolchat-v0.27-cloud-beta
          python3 /tmp/fix_profile_server_runtime_v032.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/index.ts
          git diff --cached --check
          git commit -m 'fix live v0.32 profile setup and username identity'
          git push origin HEAD:zoolchat-v0.27-cloud-beta

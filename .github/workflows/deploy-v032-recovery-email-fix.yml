name: Deploy v0.32 recovery email fix

on:
  push:
    branches:
      - zoolchat-v0.32-development
    paths:
      - scripts/deploy_v032_recovery_email_fix.trigger

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Prepare only validated recovery backend file
        shell: bash
        run: |
          set -euo pipefail
          LIVE_HEAD='1f6fc67b32bc4ec518bae165012fb82374cc90aa'
          VALIDATED='87ebfe00c2f73346ea8f3907c4a6079c4e9b8b72'
          git fetch origin zoolchat-v0.27-cloud-beta
          test "$(git rev-parse origin/zoolchat-v0.27-cloud-beta)" = "$LIVE_HEAD"
          git checkout -B live-recovery origin/zoolchat-v0.27-cloud-beta
          git checkout "$VALIDATED" -- server/src/emailRecovery.ts
          changed="$(git diff --name-only)"
          test "$changed" = 'server/src/emailRecovery.ts'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build patched backend
        working-directory: server
        run: npm ci --no-audit --no-fund && npm run build
      - name: Repackage live backend archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/server-v032.tar.gz -C server package.json package-lock.json tsconfig.json src migrations
          base64 -w 76 /tmp/server-v032.tar.gz > cloud/server-v032.tar.gz.b64
          sha256sum /tmp/server-v032.tar.gz | awk '{print $1}' > cloud/server-v032.sha256
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' cloud/server-v032.sha256 cloud/server-v032.tar.gz.b64 server/src/emailRecovery.ts | sort)"
          test "$actual" = "$expected"
      - name: Push exact recovery fix to live branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/emailRecovery.ts cloud/server-v032.tar.gz.b64 cloud/server-v032.sha256
          git diff --cached --check
          git commit -m 'deploy v0.32 password recovery email fix'
          git push origin HEAD:zoolchat-v0.27-cloud-beta
      - name: Fast live health verification
        shell: bash
        run: |
          set -euo pipefail
          git show '87ebfe00c2f73346ea8f3907c4a6079c4e9b8b72:cloud/API_BASE_URL.txt' > /tmp/api.txt
          API_URL="$(tr -d '\r\n' < /tmp/api.txt)"
          case "$API_URL" in https://*) ;; *) exit 1;; esac
          for i in $(seq 1 120); do
            HEALTH="$(curl --silent --max-time 8 "$API_URL/health" || true)"
            RECOVERY_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 -H 'Content-Type: application/json' -d '{"email":"nonexistent-validation@example.invalid"}' "$API_URL/api/auth/password/request" || true)"
            if HEALTH_JSON="$HEALTH" node -e "const h=JSON.parse(process.env.HEALTH_JSON||'{}');if(h.ok!==true||h.db!==true||h.emailConfigured!==true||h.livekitConfigured!==true||h.firebaseConfigured!==true)process.exit(1)" >/dev/null 2>&1 && [ "$RECOVERY_CODE" = '202' ]; then
              echo 'PASS: live backend healthy and recovery endpoint available'
              exit 0
            fi
            sleep 2
          done
          exit 1

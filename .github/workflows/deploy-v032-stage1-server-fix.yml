name: Deploy ZoolChat v0.32 stage-one server fixes
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/deploy-v032-stage1-server-fix.yml'
permissions:
  contents: write
jobs:
  patch-live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Prepare tested stage-one repair
        run: cp scripts/fix_stage1_critical_v032.py /tmp/fix_stage1_critical_v032.py
      - name: Patch live backend source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout zoolchat-v0.27-cloud-beta
          python3 /tmp/fix_stage1_critical_v032.py server-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/index.ts
          git diff --cached --check
          git commit -m 'fix live stage-one calls and direct chat reliability'
          git push origin HEAD:zoolchat-v0.27-cloud-beta

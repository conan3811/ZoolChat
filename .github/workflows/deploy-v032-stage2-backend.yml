name: Deploy ZoolChat v0.32 stage two backend

on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - 'scripts/deploy_stage2_backend_live.trigger'

permissions:
  contents: write

jobs:
  package-build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0

      - name: Package exact tested live backend commit
        shell: bash
        run: |
          set -euo pipefail
          LIVE_COMMIT='3dfab2c0ceaede6c7896470aaf37aebce84c1fdb'
          git fetch origin zoolchat-v0.27-cloud-beta
          CURRENT_LIVE="$(git rev-parse origin/zoolchat-v0.27-cloud-beta)"
          if [ "$CURRENT_LIVE" != "$LIVE_COMMIT" ]; then
            echo 'Live deployment branch moved; refusing unrelated changes.' >&2
            exit 1
          fi
          git checkout --detach "$LIVE_COMMIT"
          tar -czf /tmp/server-v032.tar.gz -C server package.json package-lock.json tsconfig.json src migrations
          base64 -w 76 /tmp/server-v032.tar.gz > cloud/server-v032.tar.gz.b64
          sha256sum /tmp/server-v032.tar.gz | awk '{print $1}' > cloud/server-v032.sha256
          git diff --check

      - name: Build exact live deployment image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file cloud/Dockerfile --tag zoolchat-v032-stage2-live-candidate cloud

      - name: Push packaged backend to live deployment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/server-v032.tar.gz.b64 cloud/server-v032.sha256
          git diff --cached --check
          git commit -m 'package live v0.32 stage2 backend from 3dfab2c'
          git push origin HEAD:zoolchat-v0.27-cloud-beta

      - name: Verify live rollout with fast polling
        shell: bash
        run: |
          set -euo pipefail
          git checkout zoolchat-v0.32-development -- cloud/API_BASE_URL.txt
          API_URL="$(tr -d '\r\n' < cloud/API_BASE_URL.txt)"
          case "$API_URL" in https://*) ;; *) echo 'Invalid live backend configuration' >&2; exit 1;; esac
          for i in $(seq 1 180); do
            HEALTH="$(curl --silent --max-time 10 "$API_URL/health" || true)"
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$API_URL/api/me/2fa" || true)"
            if HEALTH_JSON="$HEALTH" node -e "const h=JSON.parse(process.env.HEALTH_JSON||'{}'); if(h.ok!==true||h.db!==true||h.livekitConfigured!==true||h.firebaseConfigured!==true||h.emailConfigured!==true) process.exit(1)" >/dev/null 2>&1 && [ "$CODE" = '401' ]; then
              echo 'PASS: live stage-two backend is active and 2FA requires authentication'
              exit 0
            fi
            sleep 2
          done
          echo 'Live stage-two rollout verification timed out' >&2
          exit 1

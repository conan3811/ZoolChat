name: Export ZoolChat v0.32 Android source

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.32-development ]
    paths:
      - '.github/workflows/export-android-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current v0.32 Android source
        uses: actions/upload-artifact@v4
        with:
          name: zoolchat-v032-android-source
          path: android
          retention-days: 2
          if-no-files-found: error
# refreshed for current v0.32 Firebase rebuild

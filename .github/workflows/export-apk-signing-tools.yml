name: Export Android APK signing tools
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/export-apk-signing-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;37.0.0"
      - name: Package signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" /tmp/apk-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" /tmp/apk-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/37.0.0/lib/apksigner.jar" /tmp/apk-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools
          path: /tmp/apk-tools
          if-no-files-found: error

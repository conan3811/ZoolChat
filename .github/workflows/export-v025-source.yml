name: Export ZoolChat v0.25 Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble v0.24 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            release/parts/part00.b64 \
            release/parts/part01.b64 \
            release/parts/part02.b64 \
            release/parts/part03.b64 \
            release/parts/part04.b64 \
            release/parts/part05.b64 \
            release/parts/part06.b64 \
            release/parts/part07.b64 \
            release/safe/s08_0.b64 release/safe/s08_1.b64 release/safe/s08_2.b64 release/safe/s08_3.b64 release/safe/s08_4.b64 \
            release/safe/s09_0.b64 release/safe/s09_1.b64 release/safe/s09_2.b64 release/safe/s09_3.b64 release/safe/s09_4.b64 \
            release/parts/part10.b64 \
            release/parts/part11.b64 \
            release/safe/s12_0.b64 release/safe/s12_1.b64 release/safe/s12_2.b64 release/safe/s12_3.b64 \
            release/safe/s12_4a.b64 release/safe/s12_4b.b64 release/safe/s12_4c.b64 \
            release/parts/part13.b64 \
            > work/ZoolChat-source.b64
          base64 -d work/ZoolChat-source.b64 > work/ZoolChat-source.zip
          unzip -q work/ZoolChat-source.zip -d work

      - name: Apply v0.25 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            release/patches/v0_25_0a.b64 \
            release/patches/v0_25_0b.b64 \
            release/patches/v0_25_1.b64 \
            release/patches/v0_25_2.b64 \
            release/patches/v0_25_3.b64 \
            release/patches/v0_25_4.b64 \
            > work/v0_25_overlay.b64
          base64 -d work/v0_25_overlay.b64 > work/v0_25_overlay.tar.gz
          tar -xzf work/v0_25_overlay.tar.gz -C work/ZoolChat_v0_24

      - name: Archive patched v0.25 source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf work/ZoolChat_v0.25_Source.tar.gz -C work ZoolChat_v0_24

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v0.25-patched-source
          path: work/ZoolChat_v0.25_Source.tar.gz
          if-no-files-found: error
          retention-days: 1

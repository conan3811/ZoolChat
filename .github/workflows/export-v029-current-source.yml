name: Export ZoolChat v0.29 current source

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.29-call-accept-fix ]
    paths:
      - '.github/workflows/export-v029-current-source.yml'

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download known-good v0.28.1 source artifact
        uses: actions/download-artifact@v4
        with:
          name: zoolchat-current-v0281-source
          path: work
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: conan3811/ZoolChat
          run-id: 33990866777

      - name: Apply v0.29 Android overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release/v0_29/v0_29_groups_session_fix.b64 > work/v029-android.tar.gz
          tar -xzf work/v029-android.tar.gz -C work/ZoolChat_v0_24

      - name: Apply v0.29 cloud overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d cloud/v0_29/v0_29_groups_overlay.b64 > work/v029-cloud.tar.gz
          tar -xzf work/v029-cloud.tar.gz -C work/cloud-src

      - name: Show reconstructed source layout
        shell: bash
        run: |
          set -euo pipefail
          find work/ZoolChat_v0_24/android/app/src/main/java -type f | sort | head -120
          find work/cloud-src/server -maxdepth 3 -type f | sort | head -120

      - uses: actions/upload-artifact@v4
        with:
          name: zoolchat-v029-current-source
          path: |
            work/ZoolChat_v0_24/android
            work/cloud-src/server
          retention-days: 2

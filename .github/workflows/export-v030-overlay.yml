name: Export ZoolChat v0.30 Android overlay

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - '.github/workflows/export-v030-overlay.yml'
      - 'release/v0_30/current_part_*.b64'

permissions:
  contents: read

jobs:
  export-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble current repository overlay
        shell: bash
        run: |
          set -euo pipefail
          cat release/v0_30/current_part_00.b64 release/v0_30/current_part_01.b64 release/v0_30/current_part_02.b64 release/v0_30/current_part_03.b64 release/v0_30/current_part_04.b64 release/v0_30/current_part_05.b64 release/v0_30/current_part_06.b64 > v030.b64
          base64 -d v030.b64 > ZoolChat-v0.30-overlay.tar.gz
          sha256sum ZoolChat-v0.30-overlay.tar.gz | tee overlay.sha256
          tar -tzf ZoolChat-v0.30-overlay.tar.gz > overlay-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v0.30-repo-overlay
          path: |
            ZoolChat-v0.30-overlay.tar.gz
            overlay.sha256
            overlay-files.txt
          retention-days: 2

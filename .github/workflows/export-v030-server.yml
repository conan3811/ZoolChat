name: Export v0.30 server source

on:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - '.github/workflows/export-v030-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.30 server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src/server
          cat cloud/parts/part00.b64 cloud/parts/part01.b64 cloud/parts/part02.b64 cloud/parts/part03.b64 cloud/parts/part04.b64 cloud/parts/part05.b64 cloud/parts/part06.b64 > /tmp/server.b64
          base64 -d /tmp/server.b64 > /tmp/server.tar.gz
          echo 'c9575e33691bbb48074f3d8e03018c3e760dde46fe736b2b6d351c36653306b8  /tmp/server.tar.gz' | sha256sum -c -
          tar -xzf /tmp/server.tar.gz -C /tmp/src
          cat cloud/v0_30/cloud_part_00.b64 cloud/v0_30/cloud_part_01.b64 cloud/v0_30/cloud_part_02.b64 > /tmp/v030.b64
          base64 -d /tmp/v030.b64 > /tmp/v030.tar.gz
          echo 'db03057803bc3b8721dfd2f40abdeb55a15ab21cf5ebb5fcd941e6b2ee996dec  /tmp/v030.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v030.tar.gz -C /tmp/src/server
          sh cloud/v0_30/postfix.sh /tmp/src/server/src/index.ts
          tar -czf v030-server-source.tar.gz -C /tmp/src server
      - uses: actions/upload-artifact@v4
        with:
          name: zoolchat-v030-server-source
          path: v030-server-source.tar.gz
          retention-days: 1

name: Export private v0.32 offline Android builder
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths: ['.github/workflows/export-v032-offline-builder.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Warm every dependency needed by the public Android build
        working-directory: android
        run: gradle :app:assemblePublicDebug :app:lintPublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace
      - name: Package offline builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zool-offline
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"
          tar -cf /tmp/zool-offline/gradle-9.6.0.tar -C "$GRADLE_ROOT" .
          tar -cf /tmp/zool-offline/android-sdk.tar -C "$ANDROID_HOME" build-tools/37.0.0 platforms/android-37.0 platform-tools licenses
          tar -cf /tmp/zool-offline/java17.tar -C "$JAVA_HOME" .
          tar -cf /tmp/zool-offline/gradle-user-home.tar -C "$HOME/.gradle" caches
          printf '%s\n' "$GRADLE_ROOT" > /tmp/zool-offline/runner-paths.txt
          printf '%s\n' "$ANDROID_HOME" >> /tmp/zool-offline/runner-paths.txt
          du -sh /tmp/zool-offline/*
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-builder-private
          path: /tmp/zool-offline/*
          retention-days: 1
          if-no-files-found: error

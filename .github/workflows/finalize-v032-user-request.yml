name: Finalize v0.32 user-requested fixes
on:
  push:
    branches: [zoolchat-v0.32-development]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
      - name: Apply final source fixes
        shell: python
        run: |
          from pathlib import Path

          # Fix AccountRow calls so Kotlin trailing lambdas bind to onClick,
          # and keep the destructive style as an optional named parameter.
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/AccountScreen.kt')
          s=p.read_text()
          old='private fun AccountRow(icon:ImageVector,title:String,subtitle:String,onClick:()->Unit,danger:Boolean=false){'
          new='private fun AccountRow(icon:ImageVector,title:String,subtitle:String,danger:Boolean=false,onClick:()->Unit){'
          if old not in s and new not in s:
              raise SystemExit('AccountRow signature anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('if(emailVerified)t("موثّق") else t("غير موثّق"),onEditIdentity)', 'if(emailVerified)t("موثّق") else t("غير موثّق"),onClick=onEditIdentity)', 1)
          s=s.replace('else "@$username",onEditIdentity)', 'else "@$username",onClick=onEditIdentity)', 1)
          s=s.replace('t("حذف الحساب والبيانات المرتبطة به"),{showDelete=true},danger=true)', 't("حذف الحساب والبيانات المرتبطة به"),danger=true,onClick={showDelete=true})', 1)
          s=s.replace('t("الخروج من هذا الحساب على هذا الجهاز"),onLogout,danger=true)', 't("الخروج من هذا الحساب على هذا الجهاز"),danger=true,onClick=onLogout)', 1)
          s=s.replace('placeholder={Text("+9665xxxxxxxx")}', 'placeholder={Text("+xxxxxxxxxxxx")}', 1)
          if 'private fun AccountRow(icon:ImageVector,title:String,subtitle:String,danger:Boolean=false,onClick:()->Unit)' not in s:
              raise SystemExit('AccountRow final signature missing')
          p.write_text(s)

          # Remove any hard-coded support phone/WhatsApp target from the normal app UI.
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/SettingsHubV032.kt')
          s=p.read_text()
          start='        SettingsRow(Icons.Rounded.Phone, t("تواصل معنا"), t("فتح محادثة دعم عبر واتساب")) {'
          end='        SettingsRow(Icons.Rounded.PrivacyTip, t("الشروط وسياسة الخصوصية")'
          if start in s:
              a=s.index(start)
              b=s.index(end,a)
              replacement='        SettingsRow(Icons.Rounded.Phone, t("تواصل معنا"), t("المساعدة والدعم الفني")) { dialog = "help" }\n'
              s=s[:a]+replacement+s[b:]
          if 'wa.me/' in s:
              raise SystemExit('hard-coded WhatsApp target still present')
          p.write_text(s)

          # These one-shot mutation workflows are no longer part of the maintained source.
          Path('.github/workflows/apply-v032-android-privacy.yml').unlink(missing_ok=True)
          Path('.github/workflows/finalize-v032-user-request.yml').unlink(missing_ok=True)
      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZoolChat CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v0.32 account UI and privacy cleanup"
          git push origin HEAD:zoolchat-v0.32-development

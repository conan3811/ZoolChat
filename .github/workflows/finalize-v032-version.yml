name: Finalize v0.32 backend version identity
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths: [.github/workflows/finalize-v032-version.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
      - name: Align backend version and readiness metadata
        shell: python
        run: |
          from pathlib import Path

          package = Path('server/package.json')
          text = package.read_text()
          old = '"version": "0.31.0"'
          if old not in text:
              raise SystemExit('package version marker missing')
          package.write_text(text.replace(old, '"version": "0.32.0-dev"', 1))

          lock = Path('server/package-lock.json')
          text = lock.read_text()
          if text.count(old) < 2:
              raise SystemExit('lock version markers missing')
          lock.write_text(text.replace(old, '"version": "0.32.0-dev"', 2))

          index = Path('server/src/index.ts')
          text = index.read_text()
          import_old = "import { installEmailRecovery } from './emailRecovery.js';"
          import_new = "import { emailDeliveryConfigured, installEmailRecovery } from './emailRecovery.js';"
          if import_old not in text:
              raise SystemExit('email recovery import marker missing')
          text = text.replace(import_old, import_new, 1)
          if "version: '0.31.0'" not in text:
              raise SystemExit('health version marker missing')
          text = text.replace("version: '0.31.0'", "version: '0.32.0-dev'", 1)
          health_old = "firebaseConfigured: Boolean(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || process.env.GOOGLE_APPLICATION_CREDENTIALS), mediaStorage:"
          health_new = "firebaseConfigured: Boolean(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || process.env.GOOGLE_APPLICATION_CREDENTIALS), emailConfigured: emailDeliveryConfigured(), mediaStorage:"
          if health_old not in text:
              raise SystemExit('health firebase marker missing')
          index.write_text(text.replace(health_old, health_new, 1))
      - name: Commit finalized identity and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-v032-version.yml
          git config user.name "ZoolChat CI"
          git config user.email "actions@users.noreply.github.com"
          git add server/package.json server/package-lock.json server/src/index.ts
          git commit -m "Align v0.32 backend version and health metadata"
          git push origin HEAD:zoolchat-v0.32-development

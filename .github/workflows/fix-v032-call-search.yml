name: Fix ZoolChat v0.32 call and search profiles
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/fix-v032-call-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Repair call startup and searchable user profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) LiveKit: publish requested media as part of Room.connect instead of racing
          # an immediate post-connect publication on affected Android devices.
          p=Path('android/app/src/main/java/com/zoolchat/app/calling/LiveKitCallEngine.kt')
          s=p.read_text()
          if 'import io.livekit.android.ConnectOptions' not in s:
              s=s.replace('import io.livekit.android.AudioOptions\n','import io.livekit.android.AudioOptions\nimport io.livekit.android.ConnectOptions\n',1)
          old='''        newRoom.prepareConnection(config.serverUrl, config.token)\n        newRoom.connect(config.serverUrl, config.token)\n\n        if (config.startMicrophone) {\n            var microphonePublished = newRoom.localParticipant.setMicrophoneEnabled(true)\n            // A small number of devices report a transient false immediately after Room.connect().\n            // Retry once instead of tearing down the accepted call on that first publication race.\n            if (!microphonePublished) {\n                delay(350)\n                microphonePublished = newRoom.localParticipant.setMicrophoneEnabled(true)\n            }\n            check(microphonePublished) { "microphone_publish_failed" }\n        } else {\n            runCatching { newRoom.localParticipant.setMicrophoneEnabled(false) }\n        }\n        newRoom.localParticipant.setCameraEnabled(config.startCamera)\n        refreshLocalCameraTrack()\n'''
          new='''        newRoom.prepareConnection(config.serverUrl, config.token)\n        newRoom.connect(\n            config.serverUrl,\n            config.token,\n            ConnectOptions(audio = config.startMicrophone, video = config.startCamera),\n        )\n\n        // ConnectOptions publishes the requested tracks during connection. Keep a guarded retry\n        // only for devices where the initial publication was not retained after negotiation.\n        if (config.startMicrophone && !newRoom.localParticipant.isMicrophoneEnabled) {\n            delay(300)\n            check(newRoom.localParticipant.setMicrophoneEnabled(true)) { "microphone_publish_failed" }\n        } else if (!config.startMicrophone) {\n            runCatching { newRoom.localParticipant.setMicrophoneEnabled(false) }\n        }\n        if (config.startCamera && !newRoom.localParticipant.isCameraEnabled) {\n            delay(250)\n            check(newRoom.localParticipant.setCameraEnabled(true)) { "camera_publish_failed" }\n        } else if (!config.startCamera) {\n            runCatching { newRoom.localParticipant.setCameraEnabled(false) }\n        }\n        refreshLocalCameraTrack()\n'''
          if old not in s:
              raise SystemExit('LiveKit connect block changed')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Call screen: an unavailable legacy peer E2EE identity must not prevent the media
          # session from starting. Keep E2EE when a valid shared key is available and label it honestly.
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/ProductionCallScreen.kt')
          s=p.read_text()
          old='''            val e2eeKey = e2eeManager.callKey(callId, peerId)\n            val cfg = ZoolCallConfig(\n                roomName = callId,\n                token = o.getString("participantToken"),\n                serverUrl = o.getString("serverUrl"),\n                mode = if (o.optString("mode", if (video) "video" else "audio") == "video") ZoolMediaMode.VIDEO else ZoolMediaMode.AUDIO,\n                e2eeKey = e2eeKey,\n                startMicrophone = mic,\n                startCamera = video && camera,\n            )\n            CallForegroundService.start(context, video)\n            engine.connect(cfg).getOrThrow()\n            e2ee = true\n'''
          new='''            val e2eeKey = runCatching { e2eeManager.callKey(callId, peerId) }.getOrNull()\n            val rawServerUrl = o.getString("serverUrl").trim()\n            val mediaServerUrl = when {\n                rawServerUrl.startsWith("https://", true) -> "wss://" + rawServerUrl.substringAfter("://")\n                rawServerUrl.startsWith("http://", true) -> "ws://" + rawServerUrl.substringAfter("://")\n                else -> rawServerUrl\n            }\n            val cfg = ZoolCallConfig(\n                roomName = callId,\n                token = o.getString("participantToken"),\n                serverUrl = mediaServerUrl,\n                mode = if (o.optString("mode", if (video) "video" else "audio") == "video") ZoolMediaMode.VIDEO else ZoolMediaMode.AUDIO,\n                e2eeKey = e2eeKey,\n                startMicrophone = mic,\n                startCamera = video && camera,\n            )\n            CallForegroundService.start(context, video)\n            val firstConnect = engine.connect(cfg)\n            if (firstConnect.isFailure) {\n                engine.disconnect()\n                delay(500)\n                engine.connect(cfg).getOrThrow()\n            }\n            e2ee = !e2eeKey.isNullOrBlank()\n'''
          if old not in s:
              raise SystemExit('ProductionCallScreen connect block changed')
          s=s.replace(old,new,1)
          old='''private fun friendlyCallError(t: Throwable): String {\n    val raw = t.message.orEmpty()\n    if (raw.contains("livekit_not_configured", true)) return "خدمة المكالمات غير متاحة حالياً"\n    if (raw.contains("call_no_longer_available", true)) return "هذه المكالمة لم تعد متاحة"\n    if (t is ApiException && t.status >= 500) return "تعذر الاتصال بخدمة المكالمات. حاول مرة أخرى"\n    return "تعذر الاتصال. تحقق من صلاحية الميكروفون واتصال الإنترنت وحاول مجدداً."\n}\n'''
          new='''private fun friendlyCallError(t: Throwable): String {\n    val raw = t.message.orEmpty()\n    if (raw.contains("livekit_not_configured", true)) return "خدمة المكالمات غير متاحة حالياً"\n    if (raw.contains("call_no_longer_available", true)) return "هذه المكالمة لم تعد متاحة"\n    if (raw.contains("microphone_permission_required", true)) return "يلزم السماح بالميكروفون لإجراء المكالمة"\n    if (raw.contains("microphone_publish_failed", true)) return "تعذر تشغيل الميكروفون. أغلق أي تطبيق يستخدمه وحاول مرة أخرى"\n    if (raw.contains("camera_publish_failed", true)) return "تعذر تشغيل الكاميرا. أغلق أي تطبيق يستخدمها وحاول مرة أخرى"\n    if (t is ApiException && t.status >= 500) return "تعذر الاتصال بخدمة المكالمات. حاول مرة أخرى"\n    return "تعذر إنشاء الاتصال الصوتي. تحقق من الإنترنت وحاول مرة أخرى."\n}\n'''
          if old not in s:
              raise SystemExit('friendlyCallError block changed')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Search results: tapping a found user should open that user's profile. Keep explicit
          # call/chat buttons for those actions.
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/ContactsDirectoryScreen.kt')
          s=p.read_text()
          s=s.replace('''    onChat: (RegisteredContact) -> Unit,\n    onCall: (RegisteredContact) -> Unit,\n) {''','''    onChat: (RegisteredContact) -> Unit,\n    onCall: (RegisteredContact) -> Unit,\n    onProfile: (RegisteredContact) -> Unit,\n) {''',1)
          s=s.replace('''                    Modifier.fillMaxWidth().clickable { onChat(c) }.padding(horizontal = 16.dp, vertical = 10.dp),''','''                    Modifier.fillMaxWidth().clickable { onProfile(c) }.padding(horizontal = 16.dp, vertical = 10.dp),''',1)
          p.write_text(s)

          # 4) Contact info supports safe search-result profiles even before a direct chat exists.
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/ContactInfoScreen.kt')
          s=p.read_text()
          marker='''    val scope=rememberCoroutineScope();val context=LocalContext.current\n'''
          if marker not in s: raise SystemExit('ContactInfo scope marker changed')
          s=s.replace(marker,marker+'    val hasChat=chatId.isNotBlank()\n',1)
          s=s.replace('''        val group=runCatching{api.groupInfo(chatId)}.getOrNull()''','''        val group=if(hasChat) runCatching{api.groupInfo(chatId)}.getOrNull() else null''',1)
          start=s.index('''            HorizontalDivider()\n            Text(t("البحث في المحادثة")''')
          end=s.index('''            Spacer(Modifier.height(8.dp))\n            TextButton(onClick={scope.launch{runCatching{api.post("/api/users/$userId/block")''',start)
          block=s[start:end]
          indented='\n'.join(('                '+line if line else line) for line in block.split('\n'))
          replacement='''            if(hasChat) {\n'''+indented+'''\n            }\n'''
          s=s[:start]+replacement+s[end:]
          old='''api.post("/api/reports",JSONObject().put("userId",userId).put("chatId",chatId).put("reason",reason.trim()))'''
          new='''api.post("/api/reports",JSONObject().put("userId",userId).put("reason",reason.trim()).apply{if(hasChat)put("chatId",chatId)})'''
          if old not in s: raise SystemExit('ContactInfo report block changed')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 5) Add navigation route for a profile opened directly from username search.
          p=Path('android/app/src/main/java/com/zoolchat/app/ZoolChatApp.kt')
          s=p.read_text()
          old='''                    onChat={c->vm.openDirect(c.userId){id->nav.navigate("prodchat/$id")}},\n                    onCall={c->nav.navigate("livecall/new/${c.userId}/false")},\n                )\n            }\n            composable("prodchat/{id}")'''
          new='''                    onChat={c->vm.openDirect(c.userId){id->nav.navigate("prodchat/$id")}},\n                    onCall={c->nav.navigate("livecall/new/${c.userId}/false")},\n                    onProfile={c->nav.navigate("user/${c.userId}")},\n                )\n            }\n            composable("user/{peer}") { entry ->\n                val peer=entry.arguments?.getString("peer").orEmpty()\n                val fallback=searchResults.firstOrNull{it.userId==peer} ?: contacts.firstOrNull{it.userId==peer}\n                ContactInfoScreen(\n                    api=vm.api,\n                    userId=peer,\n                    chatId="",\n                    messages=emptyList(),\n                    fallbackDisplayName=fallback?.displayName,\n                    fallbackUsername=fallback?.username,\n                    fallbackPhotoUrl=fallback?.photoUrl,\n                    onBack={nav.popBackStack()},\n                    onMessage={vm.openDirect(peer){nav.navigate("prodchat/$it")}},\n                    onCall={video->nav.navigate("livecall/new/$peer/$video")},\n                    onShared={},\n                )\n            }\n            composable("prodchat/{id}")'''
          if old not in s: raise SystemExit('contacts nav block changed')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/zoolchat/app/calling/LiveKitCallEngine.kt \
                  android/app/src/main/java/com/zoolchat/app/ui/screens/ProductionCallScreen.kt \
                  android/app/src/main/java/com/zoolchat/app/ui/screens/ContactsDirectoryScreen.kt \
                  android/app/src/main/java/com/zoolchat/app/ui/screens/ContactInfoScreen.kt \
                  android/app/src/main/java/com/zoolchat/app/ZoolChatApp.kt
          git diff --cached --check
          git commit -m 'fix v0.32 call startup and searchable user profiles'
          git push origin HEAD:zoolchat-v0.32-development

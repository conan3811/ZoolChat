name: Fix v0.32 profile setup Compose import
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/fix-v032-launched-effect-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Add missing LaunchedEffect import
        shell: bash
        run: |
          set -euo pipefail
          f='android/app/src/main/java/com/zoolchat/app/ui/screens/InitialProfileSetupScreen.kt'
          grep -q '^import androidx.compose.runtime.LaunchedEffect$' "$f" || sed -i '/^import androidx.compose.runtime.Composable$/a import androidx.compose.runtime.LaunchedEffect' "$f"
          grep -q '^import androidx.compose.runtime.LaunchedEffect$' "$f"
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/zoolchat/app/ui/screens/InitialProfileSetupScreen.kt
          git diff --cached --check
          git commit -m 'fix profile setup LaunchedEffect import'
          git push origin HEAD:zoolchat-v0.32-development

name: Fix v0.32 passkey icon compile error
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths: ['.github/workflows/fix-v032-passkey-icon.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
      - name: Replace unavailable Material icon
        shell: python
        run: |
          from pathlib import Path
          p=Path('android/app/src/main/java/com/zoolchat/app/ui/screens/AccountScreen.kt')
          s=p.read_text()
          if 'Icons.Rounded.Passkey' not in s:
              raise SystemExit('Passkey icon anchor missing')
          s=s.replace('Icons.Rounded.Passkey','Icons.Rounded.Key',1)
          p.write_text(s)
          Path('.github/workflows/fix-v032-passkey-icon.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZoolChat CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix v0.32 account passkey icon"
          git push origin HEAD:zoolchat-v0.32-development

name: Fix ZoolChat v0.32 stage-one critical paths
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - '.github/workflows/fix-v032-stage1-critical.yml'
      - 'scripts/fix_stage1_critical_v032.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Repair calls and direct-message navigation
        run: python3 scripts/fix_stage1_critical_v032.py
      - name: Keep validation workflow for a separately authorized update
        run: git checkout -- .github/workflows/validate-v032.yml
      - name: Commit repaired source and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/src/index.ts \
            server/tests/stage1-direct-chat.mjs \
            android/app/src/main/java/com/zoolchat/app/state/ZoolAppViewModel.kt \
            android/app/src/main/java/com/zoolchat/app/ui/screens/ProductionCallScreen.kt
          git diff --cached --check
          git commit -m 'fix v0.32 stage-one calls and direct chat opening'
          git push origin HEAD:zoolchat-v0.32-development

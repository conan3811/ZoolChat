name: Fix v0.32 unread recovery permissions

on:
  push:
    branches:
      - zoolchat-v0.32-development
    paths:
      - scripts/fix_v032_unread_recovery_permissions.trigger

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Apply scoped patch
        run: python3 scripts/apply_v032_runtime_fixes.py
      - name: Verify only requested files changed
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build backend
        working-directory: server
        run: npm ci && npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android
        working-directory: android
        run: gradle :app:assemblePublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace
      - name: Commit requested files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/zoolchat/app/MainActivity.kt android/app/src/main/java/com/zoolchat/app/sync/MessageSyncRepository.kt android/app/src/main/java/com/zoolchat/app/ui/screens/ProductionCallScreen.kt server/src/emailRecovery.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m 'fix unread recovery email and permission hangs'
          git push origin HEAD:zoolchat-v0.32-development
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-runtime-fixes-no-firebase
          path: android/app/build/outputs/apk/public/debug/*.apk
          if-no-files-found: error

name: Fix v0.32 unread badge and recovery resend

on:
  push:
    branches:
      - zoolchat-v0.32-development
    paths:
      - scripts/fix_v032_unread_recovery_resend.trigger

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0

      - name: Apply scoped patch
        run: python3 scripts/apply_v032_unread_recovery_resend.py

      - name: Verify only requested source files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            android/app/src/main/java/com/zoolchat/app/state/ZoolAppViewModel.kt \
            android/app/src/main/java/com/zoolchat/app/sync/MessageSyncRepository.kt \
            android/app/src/main/java/com/zoolchat/app/ui/screens/OnboardingAuthScreens.kt | sort)"
          test "$changed" = "$expected"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compile and lint requested fixes
        working-directory: android
        shell: bash
        run: gradle :app:assemblePublicDebug :app:lintPublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace

      - name: Commit requested fixes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/zoolchat/app/state/ZoolAppViewModel.kt \
                  android/app/src/main/java/com/zoolchat/app/sync/MessageSyncRepository.kt \
                  android/app/src/main/java/com/zoolchat/app/ui/screens/OnboardingAuthScreens.kt
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix unread badge and password recovery resend'
          git push origin HEAD:zoolchat-v0.32-development

      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-unread-recovery-fix-no-firebase
          path: android/app/build/outputs/apk/public/debug/*.apk
          if-no-files-found: error

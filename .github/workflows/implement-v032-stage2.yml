name: Implement ZoolChat v0.32 stage two
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - 'scripts/implement_stage2_v032.py'
      - 'scripts/stage2_trigger.txt'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
          fetch-depth: 0
      - name: Integrate stage two source
        run: python3 scripts/implement_stage2_v032.py
      - name: Commit stage two implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/src/index.ts \
            server/src/auth.ts \
            server/src/emailRecovery.ts \
            server/src/profileV032.ts \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/com/zoolchat/app/MainActivity.kt \
            android/app/src/main/java/com/zoolchat/app/ZoolChatApp.kt \
            android/app/src/main/java/com/zoolchat/app/auth/AuthRepository.kt \
            android/app/src/main/java/com/zoolchat/app/network/ApiClient.kt \
            android/app/src/main/java/com/zoolchat/app/ui/screens/OnboardingAuthScreens.kt \
            android/app/src/main/java/com/zoolchat/app/ui/screens/AccountScreen.kt \
            android/app/src/main/java/com/zoolchat/app/ui/screens/ProfileScreen.kt
          git diff --cached --check
          git commit -m 'implement v0.32 stage2 profiles devices and real 2fa'
          git push origin HEAD:zoolchat-v0.32-development

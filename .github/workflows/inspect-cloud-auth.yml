name: Inspect ZoolChat Cloud Auth

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - '.github/workflows/inspect-cloud-auth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack server and print auth sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zsrc
          cat cloud/parts/part00.b64 cloud/parts/part01.b64 cloud/parts/part02.b64 cloud/parts/part03.b64 cloud/parts/part04.b64 cloud/parts/part05.b64 cloud/parts/part06.b64 > /tmp/server.b64
          base64 -d /tmp/server.b64 > /tmp/server.tar.gz
          tar -xzf /tmp/server.tar.gz -C /tmp/zsrc
          echo '=== FILES ==='
          find /tmp/zsrc/server -maxdepth 3 -type f | sort
          echo '=== AUTH SEARCH ==='
          grep -RniE 'register|login|phone|password|bcrypt|argon|scrypt' /tmp/zsrc/server/src /tmp/zsrc/server/migrations || true
          echo '=== SOURCE FILES ==='
          for f in $(grep -RliE 'register|login|phone|password' /tmp/zsrc/server/src | head -20); do
            echo "--- FILE: $f ---"
            sed -n '1,260p' "$f"
          done

name: Inspect ZoolChat v0.27 Crypto Source

on:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - '.github/workflows/inspect-v027-crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            release/parts/part00.b64 \
            release/parts/part01.b64 \
            release/parts/part02.b64 \
            release/parts/part03.b64 \
            release/parts/part04.b64 \
            release/parts/part05.b64 \
            release/parts/part06.b64 \
            release/parts/part07.b64 \
            release/safe/s08_0.b64 release/safe/s08_1.b64 release/safe/s08_2.b64 release/safe/s08_3.b64 release/safe/s08_4.b64 \
            release/safe/s09_0.b64 release/safe/s09_1.b64 release/safe/s09_2.b64 release/safe/s09_3.b64 release/safe/s09_4.b64 \
            release/parts/part10.b64 \
            release/parts/part11.b64 \
            release/safe/s12_0.b64 release/safe/s12_1.b64 release/safe/s12_2.b64 release/safe/s12_3.b64 \
            release/safe/s12_4a.b64 release/safe/s12_4b.b64 release/safe/s12_4c.b64 \
            release/parts/part13.b64 > work/source.b64
          base64 -d work/source.b64 > work/source.zip
          unzip -q work/source.zip -d work

      - name: Apply overlays
        shell: bash
        run: |
          set -euo pipefail
          cat release/patches/v0_25_0a.b64 release/patches/v0_25_0b.b64 release/patches/v0_25_1.b64 release/patches/v0_25_2.b64 release/patches/v0_25_3.b64 release/patches/v0_25_4.b64 > work/v025.b64
          base64 -d work/v025.b64 > work/v025.tar.gz
          tar -xzf work/v025.tar.gz -C work/ZoolChat_v0_24
          cat release/v0_26/v026_00.b64 release/v0_26/v026_01.b64 release/v0_26/v026_02.b64 release/v0_26/v026_03.b64 release/v0_26/v026_04.b64 > work/v026.b64
          base64 -d work/v026.b64 > work/v026.tar.gz
          tar -xzf work/v026.tar.gz -C work/ZoolChat_v0_24

      - name: Upload crypto sources
        uses: actions/upload-artifact@v4
        with:
          name: zoolchat-v027-crypto-source
          path: work/ZoolChat_v0_24/android/app/src/main/java/com/zoolchat/app/crypto/
          if-no-files-found: error
          retention-days: 1

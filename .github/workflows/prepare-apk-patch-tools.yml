name: Prepare APK patch tools
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths: [.github/workflows/prepare-apk-patch-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified tool releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -L --fail --retry 3 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L --fail --retry 3 -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar tools/apktool.jar --version
          java -jar tools/uber-apk-signer.jar --help >/dev/null
          sha256sum tools/* > tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zoolchat-apk-patch-tools
          path: tools/
          if-no-files-found: error

name: Run v0.32 privacy finalizer
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zoolchat-v0.32-development
      - name: Execute checked-in privacy finalizer script
        shell: python
        run: |
          from pathlib import Path
          src=Path('.github/workflows/finalize-v032-privacy.yml').read_text().splitlines()
          shell_idx=next(i for i,x in enumerate(src) if x.strip()=='shell: python')
          run_idx=next(i for i in range(shell_idx+1,len(src)) if src[i].strip()=='run: |')
          end_idx=next(i for i in range(run_idx+1,len(src)) if src[i].startswith('      - name: Commit privacy completion'))
          code=[]
          for line in src[run_idx+1:end_idx]:
              code.append(line[10:] if line.startswith('          ') else line)
          compiled='\n'.join(code)+'\n'
          exec(compile(compiled,'v032_privacy_finalizer.py','exec'),{'__name__':'__main__'})
      - name: Commit completed privacy work and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-v032-privacy.yml .github/workflows/run-finalize-v032-privacy.yml
          git config user.name "ZoolChat CI"
          git config user.email "actions@users.noreply.github.com"
          git add server android
          git commit -m "Complete v0.32 profile and notification privacy"
          git push origin HEAD:zoolchat-v0.32-development

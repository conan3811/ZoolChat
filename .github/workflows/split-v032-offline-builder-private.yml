name: Split private v0.32 offline builder
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths: ['.github/workflows/split-v032-offline-builder-private.yml']
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: '10006138777'
    steps:
      - name: Download private offline builder artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/zool-offline-builder.zip
          mkdir -p "$GITHUB_WORKSPACE/chunks"
          split -b 240M -d -a 2 /tmp/zool-offline-builder.zip "$GITHUB_WORKSPACE/chunks/zool-offline.part."
          ls -lh "$GITHUB_WORKSPACE/chunks"
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-00
          path: chunks/zool-offline.part.00
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-01
          path: chunks/zool-offline.part.01
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-02
          path: chunks/zool-offline.part.02
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-03
          path: chunks/zool-offline.part.03
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-04
          path: chunks/zool-offline.part.04
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-05
          path: chunks/zool-offline.part.05
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-06
          path: chunks/zool-offline.part.06
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-offline-part-07
          path: chunks/zool-offline.part.07
          retention-days: 1
          if-no-files-found: ignore

name: Build StreamIMDB TV armeabi-v7a APK

on:
  push:
    branches:
      - build-streamimdb-armv7-20261113
    paths-ignore:
      - StreamIMDB-TV-armeabi-v7a.apk
      - streamimdb-android-tv/app/src/main/res/raw/khyam_intro.mp4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK 35
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Bundle silent Khyam TV intro
        env:
          VIDEO_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-9004-820a-89a7-8eade0d72821/raw?se=2026-11-13T09%3A39%3A32Z&sp=r&sv=2026-06-06&sr=b&scid=640296c6-f265-5d29-9193-5200f6049ed3&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T23%3A14%3A13Z&ske=2026-11-13T23%3A14%3A13Z&sks=b&skv=2026-06-06&sig=ZPhIq8jy1H3UjBgggbEIPwOaPNxxpPFf7kFv6AMgc0s%3D"
        run: |
          set -euo pipefail
          ASSET="streamimdb-android-tv/app/src/main/res/raw/khyam_intro.mp4"
          mkdir -p "$(dirname "$ASSET")"
          if [ ! -s "$ASSET" ]; then
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 12 "$VIDEO_URL" --output "$ASSET"
          fi
          test "$(stat -c%s "$ASSET")" -gt 300000

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        run: gradle --no-daemon -p streamimdb-android-tv :app:assembleDebug --stacktrace

      - name: Verify installable APK
        run: |
          set -e
          cp streamimdb-android-tv/app/build/outputs/apk/debug/app-debug.apk StreamIMDB-TV-armeabi-v7a.apk
          test -s StreamIMDB-TV-armeabi-v7a.apk
          unzip -t StreamIMDB-TV-armeabi-v7a.apk | tail -1
          sha256sum StreamIMDB-TV-armeabi-v7a.apk
          ls -lh StreamIMDB-TV-armeabi-v7a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamIMDB-TV-armeabi-v7a
          path: StreamIMDB-TV-armeabi-v7a.apk
          if-no-files-found: error

      - name: Save APK on the isolated build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f StreamIMDB-TV-armeabi-v7a.apk streamimdb-android-tv/app/src/main/res/raw/khyam_intro.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Build StreamIMDB TV ARMv7-compatible debug APK"
            git push origin HEAD:build-streamimdb-armv7-20261113
          fi

name: Test ZoolChat v0.30 cloud backend

on:
  workflow_dispatch:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - 'cloud/v0_30/**'
      - 'cloud/Dockerfile'
      - '.github/workflows/test-cloud-v030.yml'

permissions:
  contents: read

jobs:
  test-cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zoolchat
          POSTGRES_PASSWORD: zoolchat
          POSTGRES_DB: zoolchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoolchat -d zoolchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct cloud base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/cloud-src
          cat cloud/parts/part00.b64 cloud/parts/part01.b64 cloud/parts/part02.b64 cloud/parts/part03.b64 cloud/parts/part04.b64 cloud/parts/part05.b64 cloud/parts/part06.b64 > work/cloud.b64
          base64 -d work/cloud.b64 > work/cloud.tar.gz
          echo "c9575e33691bbb48074f3d8e03018c3e760dde46fe736b2b6d351c36653306b8  work/cloud.tar.gz" | sha256sum -c -
          tar -xzf work/cloud.tar.gz -C work/cloud-src
      - name: Apply v0.30 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat cloud/v0_30/cloud_part_00.b64 cloud/v0_30/cloud_part_01.b64 cloud/v0_30/cloud_part_02.b64 > work/cloud-v030.b64
          base64 -d work/cloud-v030.b64 > work/cloud-v030.tar.gz
          echo "db03057803bc3b8721dfd2f40abdeb55a15ab21cf5ebb5fcd941e6b2ee996dec  work/cloud-v030.tar.gz" | sha256sum -c -
          tar -xzf work/cloud-v030.tar.gz -C work/cloud-src/server
          sh cloud/v0_30/postfix.sh work/cloud-src/server/src/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile
        working-directory: work/cloud-src/server
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run typecheck
      - name: Build production Docker image
        run: |
          set -euo pipefail
          docker build -t zoolchat-v030-test ./cloud
      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name zoolchat-v030-smoke --network host \
            -e PORT=8080 \
            -e DATABASE_URL='postgres://zoolchat:zoolchat@127.0.0.1:5432/zoolchat' \
            -e FREE_AUTH_ENABLED=true \
            -e FIREBASE_AUTH_ENABLED=false \
            -e DEV_AUTH_ENABLED=false \
            -e TRUST_PROXY=true \
            zoolchat-v030-test
          trap 'docker logs zoolchat-v030-smoke || true; docker stop zoolchat-v030-smoke >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok || h.service!=='zoolchat-server' || h.db!==true) process.exit(1)"

name: Validate ZoolChat v0.27 Cloud

on:
  push:
    branches: [ zoolchat-v0.27-cloud-beta ]
    paths:
      - 'cloud/**'
      - '.github/workflows/validate-v027-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloud-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolchat
          POSTGRES_PASSWORD: zoolchat
          POSTGRES_DB: zoolchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoolchat -d zoolchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify packed cloud server archive
        shell: bash
        run: |
          set -euo pipefail
          cat cloud/parts/part00.b64 cloud/parts/part01.b64 cloud/parts/part02.b64 cloud/parts/part03.b64 cloud/parts/part04.b64 cloud/parts/part05.b64 cloud/parts/part06.b64 > /tmp/server.b64
          base64 -d /tmp/server.b64 > /tmp/server.tar.gz
          echo "c9575e33691bbb48074f3d8e03018c3e760dde46fe736b2b6d351c36653306b8  /tmp/server.tar.gz" | sha256sum -c -
          tar -tzf /tmp/server.tar.gz | grep -q 'server/src/index.ts'
      - name: Build production container
        run: docker build -f cloud/Dockerfile cloud -t zoolchat-v027
      - name: Start ZoolChat against PostgreSQL
        shell: bash
        run: |
          docker run -d --name zoolchat --network host \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://zoolchat:zoolchat@127.0.0.1:5432/zoolchat \
            -e FREE_AUTH_ENABLED=true \
            -e FIREBASE_AUTH_ENABLED=false \
            -e DEV_AUTH_ENABLED=false \
            -e TRUST_PROXY=true \
            zoolchat-v027
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"version":"0.27.0"' /tmp/health.json
      - name: Smoke test registration and login
        shell: bash
        run: |
          set -euo pipefail
          REGISTER=$(curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","username":"zoolchat_ci","password":"ZoolChat-CI-2026!","phoneE164":"+966500000001","deviceName":"CI"}')
          echo "$REGISTER" | grep -q 'accessToken'
          LOGIN=$(curl -fsS -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"identifier":"zoolchat_ci","password":"ZoolChat-CI-2026!","deviceName":"CI2"}')
          echo "$LOGIN" | grep -q 'accessToken'
      - name: Container logs
        if: always()
        run: docker logs zoolchat || true

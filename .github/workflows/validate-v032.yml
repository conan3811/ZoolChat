name: Validate ZoolChat v0.32 development
on:
  push:
    branches: [zoolchat-v0.32-development]
    paths:
      - 'android/**'
      - 'server/**'
      - 'scripts/privacy_scan.py'
      - 'cloud/API_BASE_URL.txt'
      - '.github/workflows/validate-v032.yml'
      - '.github/workflows/build-v032-firebase.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zoolchat-v032-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current live backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          API_URL="$(tr -d '\r\n' < cloud/API_BASE_URL.txt)"
          case "$API_URL" in https://*) ;; *) echo "Live backend configuration is invalid" >&2; exit 1;; esac
          if ! HEALTH_JSON="$(curl --fail --silent --max-time 15 "$API_URL/health")"; then
            echo "Live backend health check failed" >&2
            exit 1
          fi
          HEALTH_JSON="$HEALTH_JSON" node - <<'NODE'
          const h=JSON.parse(process.env.HEALTH_JSON||'{}');
          const required=['ok','db','livekitConfigured','firebaseConfigured'];
          const missing=required.filter(k=>h[k]!==true);
          if(missing.length){console.error(`Live backend dependency check failed: ${missing.join(',')}`);process.exit(1)}
          console.log(`PASS: live backend dependencies healthy (version ${String(h.version||'unknown')})`);
          NODE
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zoolchat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/zoolchat_test
      FIREBASE_AUTH_ENABLED: 'false'
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: '1025'
      MAIL_FROM: ZoolChat Validation <noreply@example.invalid>
      MAIL_REQUIRE_TLS: 'false'
      EMAIL_RATE_LIMIT_PER_15_MINUTES: '100'
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-test-key
      LIVEKIT_API_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: python3 scripts/privacy_scan.py
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: |
          node dist/migrate.js
          node dist/index.js > /tmp/zoolchat-validation.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          HEALTH_JSON="$(curl --fail --silent http://127.0.0.1:8080/health)"
          HEALTH_JSON="$HEALTH_JSON" node - <<'NODE'
          const h=JSON.parse(process.env.HEALTH_JSON||'{}');
          if(h.version!=='0.32.0-dev'||h.emailConfigured!==true||h.livekitConfigured!==true){console.error('v0.32 backend identity/readiness metadata invalid');process.exit(1)}
          console.log('PASS: v0.32 backend identity and email/LiveKit readiness metadata');
          NODE
          node tests/read-state.mjs
          node tests/auth-flow.mjs
          node tests/call-lifecycle.mjs
          node tests/smtp-delivery.mjs
          node tests/email-recovery.mjs
          node tests/profile-meeting.mjs
        working-directory: server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and validate Android
        working-directory: android
        run: gradle :app:assemblePublicDebug :app:lintPublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-validation-only-no-firebase
          path: |
            android/app/build/outputs/apk/public/debug/*.apk
            android/app/build/reports/lint-results-publicDebug.*
          if-no-files-found: error

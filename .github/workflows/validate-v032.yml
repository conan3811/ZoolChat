name: Validate ZoolChat v0.32 development
on:
  push:
    branches: [zoolchat-v0.32-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zoolchat_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/zoolchat_test
      FIREBASE_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: python3 scripts/privacy_scan.py
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: |
          node dist/migrate.js
          node dist/index.js > /tmp/zoolchat-validation.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          node tests/read-state.mjs
        working-directory: server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and validate Android
        working-directory: android
        run: gradle :app:assemblePublicDebug :app:lintPublicDebug -PZOOLCHAT_API_BASE_URL="$(tr -d '\r\n' < ../cloud/API_BASE_URL.txt)" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZoolChat-v032-validation-only-no-firebase
          path: |
            android/app/build/outputs/apk/public/debug/*.apk
            android/app/build/reports/lint-results-publicDebug.*
          if-no-files-found: error
